<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Edição local de notícias de política e tecnologia, com fontes e descrições atribuídas." />
    <title>Daily News — Política e Tecnologia</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <div>
          <p class="eyebrow">Daily News · leitura local</p>
          <h1>Notícias do dia</h1>
          <p id="edicao-data" class="lede" hidden></p>
        </div>
        <div class="header-actions">
          <button id="refresh" class="button" type="button" hidden>Atualizar</button>
        </div>
      </div>
    </header>

    <main id="conteudo" class="wrap">
      <section class="section" aria-labelledby="politica-titulo">
        <div class="section-head">
          <h2 id="politica-titulo">Política</h2>
        </div>
        <div id="politica-lista" class="grid" aria-busy="true">
          <p class="placeholder">Carregando notícias…</p>
        </div>
      </section>

      <section class="section" aria-labelledby="tecnologia-titulo">
        <div class="section-head">
          <h2 id="tecnologia-titulo">Tecnologia</h2>
        </div>
        <div id="tecnologia-lista" class="grid" aria-busy="true">
          <p class="placeholder">Carregando notícias…</p>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>Coleta: <strong id="coleta-data">Data de coleta não informada</strong></p>
      </div>
    </footer>

    <script src="/app.js" defer></script>
  </body>
</html>
